name: Kuwo Music
description: >-
  Kuwo Music (酷我音乐) is a Chinese online music streaming service, founded in
  Beijing in 2005, that grew from a desktop music player into one of China's
  major consumer streaming apps across desktop, web, and mobile. Kuwo merged
  with Kugou under China Music Corporation, which was subsequently acquired by
  Tencent Music Entertainment Group, and Kuwo now operates as one of TME's music
  apps alongside QQ Music and Kugou. Kuwo entered the API Evangelist network as
  a venture-portfolio lead via Qiming. It is a consumer-facing streaming
  property rather than an API-first provider, and no public developer program,
  API documentation, or machine-readable API surface has been verified for it.
